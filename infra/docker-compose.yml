version: "3.9"

services:
  backend:
    build:
      context: ..
      dockerfile: infra/dockerfiles/backend.Dockerfile
    ports:
      - "8000:8000"
    environment:
      WEBWATCHER_DATABASE_URL: sqlite+aiosqlite:///data/webwatcher.db
    volumes:
      - ../config:/app/config:ro
      - ../data:/data
    command: ["uvicorn", "apps.backend.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
